[project]
name = "ai-engineer-learning"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    # Web framework + server
    "fastapi",
    "uvicorn",
    "streamlit",
    
    # Data & validation
    "pydantic",
    "python-dotenv",
    "requests",
    
    # LLM & retrieval
    "openai",
    "chromadb",
    "cohere",
    "pinecone",
    
    # LangChain ecosystem
    "langchain",
    "langchain-core",
    "langchain-openai",
    "langchain-chroma",
    "langchain-pinecone",
    "langchain-community",
    "langchain-text-splitters",
    
    # Agent orchestration
    "langgraph",
    
    # MCP integration
    "langchain-mcp-adapters",
    "mcp",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_basics*", "mcp_learning*"]
exclude = ["*.egg-info*", "chroma_db_lc*", ".venv*"]
